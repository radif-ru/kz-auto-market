[project]
name = "kz-auto-market"
version = "0.1.0"
description = "Очистка продаж новых автомобилей в Казахстане за 2019 год и анализ позиции автоцентра «Меркур Авто»"
readme = "README.md"
authors = [
    { name = "Radif Ilaltdinov", email = "i@radif.ru" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-11-06T00:00:00Z"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

